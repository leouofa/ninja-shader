name = "bio_scanner_xray"
description = "Medical and cyberware X-ray holographic diagnostic scanner with HUD target reticle"
input = "test_input.mp4"
output = "output/bio_scanner_xray.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "grayscale"
enabled = true
[passes.params]
strength = 1.0

[[passes]]
shader = "neon_edge"
enabled = true
[passes.params]
edge_strength = 2.8
base_mix = 0.30
neon_color = [0.1, 0.9, 1.0]

[[passes]]
shader = "hologram"
enabled = true
[passes.params]
scanline_density = 260.0
flicker_speed = 8.0
jitter = 0.003
tint = [0.15, 0.85, 1.0]

[[passes]]
shader = "radar_hud"
enabled = true
[passes.params]
sweep_speed = 1.4
reticle_scale = 0.38
hud_opacity = 0.80
hud_color = [0.2, 1.0, 0.9]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.45
intensity = 1.25
radius = 3.5
