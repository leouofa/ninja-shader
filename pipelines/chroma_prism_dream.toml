name = "chroma_prism_dream"
description = "Dreamlike optical prism refraction with halation, bloom, chromatic aberration, and motion trails"
input = "test_input.mp4"
output = "output/chroma_prism_dream.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "kaleido_prism"
enabled = true
[passes.params]
segments = 8.0
rotation_speed = 0.15
zoom = 1.0
mix_amount = 0.60

[[passes]]
shader = "halation"
enabled = true
[passes.params]
threshold = 0.60
radius = 5.0
strength = 0.90
tint = [1.0, 0.3, 0.4]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.45
intensity = 1.3
radius = 4.0

[[passes]]
shader = "chromatic_aberration"
enabled = true
[passes.params]
amount = 0.015

[[passes]]
shader = "motion_trails"
enabled = true
[passes.params]
decay = 0.40
