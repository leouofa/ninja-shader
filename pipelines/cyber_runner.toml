name = "cyber_runner"
description = "Blade Runner neon split-tone look with glowing highlights, halation, and organic film grain"
input = "test_input.mp4"
output = "output/cyber_runner.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "duotone_cyber"
enabled = true
[passes.params]
contrast = 1.3
mix_amount = 0.8
shadow_color = [0.03, 0.07, 0.25]
highlight_color = [1.0, 0.20, 0.60]

[[passes]]
shader = "halation"
enabled = true
[passes.params]
threshold = 0.65
radius = 4.5
strength = 0.85
tint = [1.0, 0.25, 0.10]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.55
intensity = 1.25
radius = 3.5

[[passes]]
shader = "film_grain"
enabled = true
[passes.params]
intensity = 0.08
size = 1.2

[[passes]]
shader = "vignette"
enabled = true
[passes.params]
intensity = 0.75
radius = 0.8
softness = 0.45
tint = [0.01, 0.02, 0.05]
