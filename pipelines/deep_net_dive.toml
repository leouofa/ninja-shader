name = "deep_net_dive"
description = "Cyberspace netrunner data-tunnel immersion with matrix rain, kaleidoscope prism, and phosphor trails"
input = "test_input.mp4"
output = "output/deep_net_dive.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "ascii_matrix"
enabled = true
[passes.params]
cell_size = 9.0
rain_speed = 3.2
color_mix = 0.30
glyph_color = [0.1, 1.0, 0.5]

[[passes]]
shader = "kaleido_prism"
enabled = true
[passes.params]
segments = 4.0
rotation_speed = 0.20
zoom = 1.1
mix_amount = 0.75

[[passes]]
shader = "neon_edge"
enabled = true
[passes.params]
edge_strength = 2.0
base_mix = 0.60
neon_color = [0.2, 0.9, 1.0]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.40
intensity = 1.3
radius = 4.0

[[passes]]
shader = "motion_trails"
enabled = true
[passes.params]
decay = 0.38
