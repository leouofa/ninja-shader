name = "ghost_hologram"
description = "Volumetric cyan holoprojector with glowing edges, interference lines, and CRT scanlines"
input = "test_input.mp4"
output = "output/ghost_hologram.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "hologram"
enabled = true
[passes.params]
scanline_density = 280.0
flicker_speed = 14.0
jitter = 0.005
tint = [0.12, 0.90, 1.0]

[[passes]]
shader = "neon_edge"
enabled = true
[passes.params]
edge_strength = 2.0
base_mix = 0.7
neon_color = [0.0, 1.0, 0.9]

[[passes]]
shader = "rgb_wave"
enabled = true
[passes.params]
amplitude = 0.008
frequency = 16.0
speed = 3.0

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.50
intensity = 1.3
radius = 4.0

[[passes]]
shader = "crt_scanlines"
enabled = true
[passes.params]
curvature = 0.08
scanline_intensity = 0.2
scanline_count = 420.0
