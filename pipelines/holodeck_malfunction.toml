name = "holodeck_malfunction"
description = "Failing holographic environment simulator revealing digital glitches and floor grid breakdown"
input = "test_input.mp4"
output = "output/holodeck_malfunction.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "hologram"
enabled = true
[passes.params]
scanline_density = 220.0
flicker_speed = 15.0
jitter = 0.006
tint = [0.2, 0.9, 1.0]

[[passes]]
shader = "block_corrupt"
enabled = true
[passes.params]
corruption_rate = 0.18
grid_scale = 16.0
color_crush = 5.0

[[passes]]
shader = "digital_glitch"
enabled = true
[passes.params]
intensity = 0.30
block_size = 22.0
chroma_shift = 0.015

[[passes]]
shader = "synthwave_grid"
enabled = true
[passes.params]
horizon = 0.42
scroll_speed = 1.2
grid_density = 14.0
opacity = 0.65
grid_color = [0.1, 0.9, 1.0]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.55
intensity = 1.1
radius = 3.5
