name = "infrared_sat_link"
description = "Low-bitrate orbital reconnaissance thermal satellite feed with tactical HUD telemetry"
input = "test_input.mp4"
output = "output/infrared_sat_link.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "thermal_infrared"
enabled = true
[passes.params]
heat_gain = 1.3
contrast = 1.25
isotherm_lines = 0.15

[[passes]]
shader = "pixelate"
enabled = true
[passes.params]
pixel_size = 4.0
color_levels = 24.0
grid_line = 0.10

[[passes]]
shader = "radar_hud"
enabled = true
[passes.params]
sweep_speed = 1.0
reticle_scale = 0.45
hud_opacity = 0.75
hud_color = [1.0, 0.9, 0.2]

[[passes]]
shader = "vhs_tracking"
enabled = true
[passes.params]
bar_intensity = 0.35
scroll_speed = 0.20
head_switch_height = 0.03
line_jitter = 0.004

[[passes]]
shader = "vignette"
enabled = true
[passes.params]
intensity = 0.70
radius = 0.80
softness = 0.35
tint = [0.0, 0.0, 0.0]
