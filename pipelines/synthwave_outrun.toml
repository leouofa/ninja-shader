name = "synthwave_outrun"
description = "80s retro synthwave look with scrolling laser floor grid, neon split toning, and glowing CRT"
input = "test_input.mp4"
output = "output/synthwave_outrun.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "duotone_cyber"
enabled = true
[passes.params]
contrast = 1.25
mix_amount = 0.75
shadow_color = [0.08, 0.02, 0.28]
highlight_color = [1.0, 0.12, 0.70]

[[passes]]
shader = "synthwave_grid"
enabled = true
[passes.params]
horizon = 0.40
scroll_speed = 1.8
grid_density = 18.0
opacity = 0.80
grid_color = [1.0, 0.05, 0.60]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.55
intensity = 1.2
radius = 3.5

[[passes]]
shader = "crt_scanlines"
enabled = true
[passes.params]
curvature = 0.10
scanline_intensity = 0.25
scanline_count = 360.0

[[passes]]
shader = "vignette"
enabled = true
[passes.params]
intensity = 0.8
radius = 0.75
softness = 0.40
tint = [0.05, 0.0, 0.15]
