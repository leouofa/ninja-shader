name = "tactical_nvg"
description = "Military Gen-3 night-vision goggles with IR amplification, radar visor, and scintillation"
input = "test_input.mp4"
output = "output/tactical_nvg.mp4"

[settings]
scale = 1.0
crf = 18
preset = "medium"
copy_audio = true

[[passes]]
shader = "night_vision"
enabled = true
[passes.params]
gain = 2.0
noise_amount = 0.14
tube_vignette = 0.75
phosphor_tint = [0.12, 1.0, 0.22]

[[passes]]
shader = "radar_hud"
enabled = true
[passes.params]
sweep_speed = 2.0
reticle_scale = 0.40
hud_opacity = 0.60
hud_color = [0.2, 1.0, 0.4]

[[passes]]
shader = "bloom"
enabled = true
[passes.params]
threshold = 0.60
intensity = 1.1
radius = 3.0

[[passes]]
shader = "film_grain"
enabled = true
[passes.params]
intensity = 0.08
size = 1.0

[[passes]]
shader = "vignette"
enabled = true
[passes.params]
intensity = 0.90
radius = 0.65
softness = 0.40
tint = [0.0, 0.0, 0.0]
