name = "duotone_cyber"
description = "Cyberpunk split-toning mapping shadows and highlights across neon palettes"
author = "ninja-shader"
language = "wgsl"
source = "duotone_cyber.wgsl"

[[params]]
name = "contrast"
type = "float"
default = 1.25
min = 0.5
max = 3.0
description = "S-curve contrast adjustment"

[[params]]
name = "mix_amount"
type = "float"
default = 0.85
min = 0.0
max = 1.0
description = "Duotone effect blend strength"

[[params]]
name = "shadow_color"
type = "vec3"
default = [0.04, 0.08, 0.28]
description = "Deep shadow tone (e.g. midnight blue/cyan)"

[[params]]
name = "highlight_color"
type = "vec3"
default = [1.0, 0.15, 0.65]
description = "Bright highlight tone (e.g. neon magenta/pink)"
