name = "halation"
description = "Analog cinema / cyber-noir red-orange emulsion halation scatter around bright edges"
author = "ninja-shader"
language = "wgsl"
source = "halation.wgsl"

[[params]]
name = "threshold"
type = "float"
default = 0.68
min = 0.1
max = 1.0
description = "Luminance cutoff threshold for halation bleed"

[[params]]
name = "radius"
type = "float"
default = 4.0
min = 0.5
max = 12.0
description = "Halation scatter radius in pixels"

[[params]]
name = "strength"
type = "float"
default = 0.75
min = 0.0
max = 3.0
description = "Halation color bleed strength"

[[params]]
name = "tint"
type = "vec3"
default = [1.0, 0.22, 0.08]
description = "Halation bleed color (warm red-orange)"
