name = "rgb_wave"
description = "Sinusoidal and sawtooth horizontal wave distortion with phase-offset RGB channels"
author = "ninja-shader"
language = "wgsl"
source = "rgb_wave.wgsl"

[[params]]
name = "amplitude"
type = "float"
default = 0.015
min = 0.0
max = 0.1
description = "Horizontal wave displacement amplitude"

[[params]]
name = "frequency"
type = "float"
default = 12.0
min = 1.0
max = 60.0
description = "Wave oscillation frequency"

[[params]]
name = "speed"
type = "float"
default = 4.0
min = 0.0
max = 20.0
description = "Oscillation speed"

[[params]]
name = "rgb_phase"
type = "float"
default = 1.5
min = 0.0
max = 6.28
description = "Phase offset between color channels"
