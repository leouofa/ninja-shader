name = "synthwave_grid"
description = "Outrun perspective scrolling laser floor grid and horizon glow"
author = "ninja-shader"
language = "wgsl"
source = "synthwave_grid.wgsl"

[[params]]
name = "horizon"
type = "float"
default = 0.38
min = 0.1
max = 0.8
description = "Vertical screen position of horizon line (0.0 to 1.0)"

[[params]]
name = "scroll_speed"
type = "float"
default = 1.50
min = 0.0
max = 10.0
description = "Forward grid motion speed"

[[params]]
name = "grid_density"
type = "float"
default = 16.0
min = 4.0
max = 48.0
description = "Number of perspective grid divisions"

[[params]]
name = "opacity"
type = "float"
default = 0.75
min = 0.0
max = 1.0
description = "Grid layer blend opacity"

[[params]]
name = "grid_color"
type = "vec3"
default = [1.0, 0.08, 0.65]
description = "Laser neon color"
