name = "thermal_infrared"
description = "FLIR false-color thermal imaging mapping luminance across ironbow heat gradients"
author = "ninja-shader"
language = "wgsl"
source = "thermal_infrared.wgsl"

[[params]]
name = "heat_gain"
type = "float"
default = 1.15
min = 0.5
max = 2.5
description = "Sensitivity gain for heat signatures"

[[params]]
name = "contrast"
type = "float"
default = 1.20
min = 0.5
max = 2.5
description = "Thermal gradient contrast"

[[params]]
name = "isotherm_lines"
type = "float"
default = 0.15
min = 0.0
max = 1.0
description = "Isotherm contour step intensity"

[[params]]
name = "palette_shift"
type = "float"
default = 0.0
min = 0.0
max = 1.0
description = "0.0 for ironbow, 1.0 for rainbow thermal"
