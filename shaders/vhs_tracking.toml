name = "vhs_tracking"
description = "Analog VHS magnetic tape tracking error bars and head-switching noise band"
author = "ninja-shader"
language = "wgsl"
source = "vhs_tracking.wgsl"

[[params]]
name = "bar_intensity"
type = "float"
default = 0.55
min = 0.0
max = 1.0
description = "Tracking error band displacement and distortion strength"

[[params]]
name = "scroll_speed"
type = "float"
default = 0.35
min = 0.0
max = 2.0
description = "Vertical rolling tracking bar scroll speed"

[[params]]
name = "head_switch_height"
type = "float"
default = 0.06
min = 0.0
max = 0.2
description = "Bottom screen head-switching noise zone height"

[[params]]
name = "line_jitter"
type = "float"
default = 0.008
min = 0.0
max = 0.05
description = "Horizontal line sync jitter amplitude"
