name = "vignette"
description = "Smooth radial vignette with configurable intensity, radius, softness, and tint"
author = "ninja-shader"
language = "wgsl"
source = "vignette.wgsl"

[[params]]
name = "intensity"
type = "float"
default = 0.75
min = 0.0
max = 2.0
description = "Vignette darkening strength at edges"

[[params]]
name = "radius"
type = "float"
default = 0.75
min = 0.1
max = 2.0
description = "Inner radius before falloff begins"

[[params]]
name = "softness"
type = "float"
default = 0.45
min = 0.01
max = 1.0
description = "Width of the falloff transition"

[[params]]
name = "tint"
type = "vec3"
default = [0.0, 0.0, 0.0]
description = "Edge tint color (default black)"
